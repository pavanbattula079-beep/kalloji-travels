<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalloji Travels</title>
    <style>
        body{
            font-family: Arial;
            margin:0;
            background:#f4f4f4;
        }
        header{
            background:#0b6efd;
            color:white;
            padding:15px;
            text-align:center;
        }
        nav{
            background:#333;
            padding:10px;
            text-align:center;
        }
        nav a{
            color:white;
            margin:10px;
            text-decoration:none;
        }
        .container{
            padding:30px;
        }
        .booking-form{
            background:white;
            padding:20px;
            width:400px;
            margin:auto;
            border-radius:8px;
        }
        input,select,textarea{
            width:100%;
            padding:10px;
            margin:8px 0;
        }
        button{
            background:#0b6efd;
            color:white;
            border:none;
            padding:10px;
            width:100%;
            cursor:pointer;
        }
        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:10px;
            margin-top:20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Kalloji Travels</h1>
    <p>Your Comfortable Journey Starts Here</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Booking</a>
    <a href="#">Routes</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

<h2 style="text-align:center;">Book Your Bus Ticket</h2>

<div class="booking-form">

<form>

<label>Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter email">

<label>Mobile</label>
<input type="text" placeholder="Enter mobile number">

<label>From</label>
<input type="text" placeholder="Departure city">

<label>To</label>
<input type="text" placeholder="Destination city">

<label>Bus Type</label>
<select>
<option>AC Sleeper</option>
<option>Non AC Sleeper</option>
<option>Luxury Volvo</option>
</select>

<label>No. of Seats</label>
<input type="number">

<label>Message</label>
<textarea placeholder="Any special request"></textarea>

<button type="submit">Book Now</button>

</form>

</div>

</div>

<footer>
<p>© 2026 Kalloji Travels | All Rights Reserved</p>
</footer>

</body>
</html>
